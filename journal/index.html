<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Journal</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 19.5A2.5 2.5 0 0 1 6.5 17H20'%3E%3C/path%3E%3Cpath d='M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5V4.5A2.5 2.5 0 0 1 6.5 2z'%3E%3C/path%3E%3Cline x1='16' y1='6' x2='18' y2='6'%3E%3C/line%3E%3Cline x1='16' y1='10' x2='18' y2='10'%3E%3C/line%3E%3Cline x1='16' y1='14' x2='18' y2='14'%3E%3C/line%3E%3Cline x1='20' y1='5.5' x2='20' y2='10'%3E%3C/line%3E%3Cline x1='20' y1='11.5' x2='20' y2='16'%3E%3C/line%3E%3C/svg%3E">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
       
        :root {
            --bg: #0a0a0a;
            --sidebar-bg: #111111;
            --card-bg: #1a1a1a;
            --text: #e0e0e0;
            --text-muted: #888888;
            --accent: #3b82f6;
            --border: #333333;
        }
       
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
       
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
       
        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
       
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
       
        .hamburger {
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            border-radius: 6px;
            transition: background 0.2s;
        }
       
        .hamburger:hover {
            background: #222;
        }
       
        .hamburger span {
            display: block;
            width: 20px;
            height: 2px;
            background: var(--text);
            border-radius: 1px;
        }
       
        .menu-dropdown {
            position: absolute;
            top: 60px;
            left: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px;
            min-width: 200px;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: none;
        }
       
        .menu-dropdown.open {
            display: block;
        }
       
        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text);
            transition: background 0.15s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }
       
        .menu-item:hover {
            background: #2a2a2a;
        }
       
        .menu-item .toggle-label {
            margin-left: auto;
            font-size: 12px;
            color: var(--accent);
            font-weight: 600;
        }
       
        .date-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
       
        .date-item {
            padding: 12px 16px;
            margin: 4px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }
       
        .date-item:hover {
            background-color: #222222;
        }
       
        .date-item.current {
            background-color: #1f1f1f;
            border: 1px solid var(--accent);
        }
       
        .date-item.empty,
        .date-item.partial,
        .date-item.complete {
            opacity: 1;
        }
       
        .date-item.future {
            opacity: 0.1;
            cursor: not-allowed;
        }
       
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
       
        .header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
        }
       
        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }
       
        .current-date {
            font-size: 18px;
            color: var(--accent);
        }
       
        .content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            background-color: var(--bg);
        }
       
        .form-section {
            margin-bottom: 40px;
        }
       
        .section-title {
            font-size: 18px;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            color: var(--accent);
        }
       
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
       
        label {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }
       
        input, textarea {
            background-color: #222222;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 15px;
            transition: border 0.2s;
        }
       
        input:focus, textarea:focus {
            border-color: var(--accent);
            outline: none;
        }
       
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
            padding: 0;
        }
       
        textarea {
            min-height: 80px;
            resize: vertical;
            overflow-y: hidden;
        }
        textarea.auto-grow {
            min-height: 100px;
            max-height: none;
            overflow-y: hidden;
            resize: none;
        }
       
        .meal-row {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 12px;
        }
        .charts-row {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .chart-container {
            flex: 1;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            min-width: 220px;
            min-height: 280px;
        }
       
        #importFile {
            display: none;
        }
       
        .stretch-check {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            cursor: pointer;
            font-size: 15px;
            color: #ddd;
            font-weight: 500;
            user-select: none;
        }
        .stretch-check input {
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <button class="hamburger" id="hamburgerBtn" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            Journal Entries
        </div>
        <div class="menu-dropdown" id="menuDropdown">
            <button class="menu-item" id="unitToggleBtn">
                <span>Units</span>
                <span class="toggle-label" id="unitToggleLabel">Kg</span>
            </button>
            <button class="menu-item" id="exportBtn">Export Data</button>
            <button class="menu-item" id="importBtn">Import Data</button>
            <button class="menu-item" id="updatePBsBtn">Update Personal Bests</button>
        </div>
        <input type="file" id="importFile" accept=".json,application/json">
        <div class="date-list" id="dateList"></div>
    </div>
   
    <div class="main">
        <div class="header">
            <h1>Daily Journal</h1>
            <div class="current-date" id="currentDateDisplay"></div>
        </div>
       
        <div class="content">
            <div id="formContainer"></div>
        </div>
    </div>

    <!-- Update Personal Bests Modal -->
    <div id="pbModalOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:2000; align-items:center; justify-content:center; padding:16px;">
        <div style="background:var(--card-bg); border:1px solid var(--border); border-radius:14px; width:100%; max-width:480px; max-height:90vh; display:flex; flex-direction:column; overflow:hidden;">
            <div style="display:flex; justify-content:space-between; align-items:center; padding:16px 18px; border-bottom:1px solid var(--border);">
                <h2 style="font-size:1.1rem; font-weight:600; margin:0;">Update Personal Bests</h2>
                <button id="pbModalClose" style="background:none; border:none; color:var(--text-muted); font-size:1.5rem; cursor:pointer; line-height:1;">&times;</button>
            </div>
            <div style="padding:16px 18px; overflow-y:auto; flex:1;">
                <label style="display:block; font-size:0.8rem; color:var(--text-muted); margin-bottom:8px;">Paste workout JSON</label>
                <textarea id="pbJsonInput" style="width:100%; min-height:220px; background:#222; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:12px; font-family:ui-monospace,monospace; font-size:13px; resize:vertical; line-height:1.4;"></textarea>
            </div>
            <div style="padding:14px 18px; border-top:1px solid var(--border);">
                <button id="pbUpdateBtn" style="width:100%; padding:14px; background:var(--accent); color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; font-family:inherit;">Update & Copy</button>
            </div>
        </div>
    </div>

    <script>
        function formatDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
       
        function formatDisplayDate(dateStr) {
            const [year, month, day] = dateStr.split('-').map(Number);
            const date = new Date(year, month - 1, day);
            return date.toLocaleDateString('en-US', {
                weekday: 'short',
                month: 'short',
                day: 'numeric'
            });
        }
       
        let journalData = {};
        let currentDateKey = formatDateKey(new Date());
        let useLbs = false; // false = kg, true = lbs
       
        const KG_TO_LBS = 2.20462;
        const LBS_TO_KG = 1 / KG_TO_LBS;

        // Single source of truth for fallback placeholders (weights stored in kg)
        const PLACEHOLDERS = {
            shoulders_weight: 7.5,          // per hand
            shoulders_reps: 10,

            military_press_weight: 12.5,          // per hand
            military_press_reps: 10,

            curls_weight: 12.5,          // per hand
            curls_reps: 10,

            tricep_curls_weight: 17.5,
            tricep_curls_reps: 8,

            chest_flies_weight: 7.5,          // per hand
            chest_flies_reps: 12,

            chest_presses_weight: 20,
            chest_presses_reps: 10,

            pushups_standard_reps: 15,
            pushups_tricep_reps: 5,

            crunches_reps: 35,
            crossing_crunches_reps: 15,
            oblique_crunches_reps: 10,
            leg_lifts_reps: 15,
            scissor_kicks_reps: 50,
            jack_knives_reps: 5,
            bicycle_twists_reps: 35,
            plank_time: '0:30',
            inverted_plank_time: '0:30',

            elliptical_bike_time: '30',
            body_weight: 70,
        };

        const PER_HAND_FIELDS = [
            'shoulders_weight', 'military_press_weight',
            'curls_weight', 'chest_flies_weight'
        ];

        const WEIGHT_REP_PAIRS = {
            shoulders_weight: 'shoulders_reps',
            military_press_weight: 'military_press_reps',
            curls_weight: 'curls_reps',
            tricep_curls_weight: 'tricep_curls_reps',
            chest_flies_weight: 'chest_flies_reps',
            chest_presses_weight: 'chest_presses_reps'
        };

        const TIME_FIELDS = ['plank_time', 'inverted_plank_time'];
       
        function loadData() {
            const saved = localStorage.getItem('journalData');
            if (saved) journalData = JSON.parse(saved);
            // Ensure shared longer_term_plans exists
            if (typeof journalData.longer_term_plans === 'undefined') {
                journalData.longer_term_plans = '';
            }
            // Load unit preference
            const unitPref = localStorage.getItem('journalUnit');
            if (unitPref === 'lbs') useLbs = true;
        }
       
        function saveData() {
            localStorage.setItem('journalData', JSON.stringify(journalData));
            localStorage.setItem('journalUnit', useLbs ? 'lbs' : 'kg');
        }
       
        function getPreviousValue(fieldKey, currentDate) {
            // Shared field has no "previous" concept across dates
            if (fieldKey === 'longer_term_plans') return '';
            const dates = Object.keys(journalData).sort().reverse();
            for (let date of dates) {
                if (date < currentDate && journalData[date] && journalData[date][fieldKey] !== undefined) {
                    const val = journalData[date][fieldKey];
                    const cleaned = typeof val === 'string' ? val.trim() : val;
                    // Skip blank or zero so we surface the most recent non-zero value
                    if (cleaned === '' || cleaned === 0 || cleaned === '0' || cleaned === null || cleaned === false) {
                        continue;
                    }
                    return cleaned;
                }
            }
            return '';
        }
       
        // Convert a stored kg value for display (to current unit)
        function toDisplayWeight(kgVal) {
            if (kgVal === undefined || kgVal === null || kgVal === '') return '';
            const num = parseFloat(kgVal);
            if (isNaN(num)) return kgVal;
            if (useLbs) return Math.round(num * KG_TO_LBS * 10) / 10;
            return num;
        }
       
        // Convert a displayed value back to kg for storage
        function toStorageWeight(displayVal) {
            if (displayVal === undefined || displayVal === null || displayVal === '') return undefined;
            const num = parseFloat(displayVal);
            if (isNaN(num)) return undefined;
            if (useLbs) return Math.round(num * LBS_TO_KG * 100) / 100;
            return num;
        }
       
        function weightUnitLabel() {
            return useLbs ? 'lbs' : 'kg';
        }

        function getPlaceholderDisplay(key) {
            const raw = PLACEHOLDERS[key];
            if (raw === undefined || raw === null) return '';

            // Weight fields
            if (key.endsWith('_weight') || key === 'body_weight') {
                const num = parseFloat(raw);
                if (isNaN(num)) return String(raw);
                const display = useLbs
                    ? Math.round(num * KG_TO_LBS * 10) / 10
                    : num;
                return PER_HAND_FIELDS.includes(key)
                    ? `${display} per hand`
                    : String(display);
            }

            // Everything else
            return String(raw);
        }
       
        const fields = {
            stretches_pre: { type: 'checkbox', label: 'Stretches' },
            shoulders_weight: { type: 'number', label: 'Shoulders Weight', placeholder: 'e.g. 45', isWeight: true },
            shoulders_reps: { type: 'number', label: 'Shoulders Reps', placeholder: 'e.g. 12' },
            curls_weight: { type: 'number', label: 'Curls Weight', placeholder: 'e.g. 30', isWeight: true },
            curls_reps: { type: 'number', label: 'Curls Reps', placeholder: 'e.g. 15' },
            tricep_curls_weight: { type: 'number', label: 'Tricep Curls Weight', placeholder: 'e.g. 25', isWeight: true },
            tricep_curls_reps: { type: 'number', label: 'Tricep Curls Reps', placeholder: 'e.g. 15' },
            military_press_weight: { type: 'number', label: 'Military Press Weight', placeholder: 'e.g. 50', isWeight: true },
            military_press_reps: { type: 'number', label: 'Military Press Reps', placeholder: 'e.g. 10' },
            chest_flies_weight: { type: 'number', label: 'Chest Flies Weight', placeholder: 'e.g. 40', isWeight: true },
            chest_flies_reps: { type: 'number', label: 'Chest Flies Reps', placeholder: 'e.g. 12' },
            chest_presses_weight: { type: 'number', label: 'Chest Presses Weight', placeholder: 'e.g. 60', isWeight: true },
            chest_presses_reps: { type: 'number', label: 'Chest Presses Reps', placeholder: 'e.g. 10' },
            pushups_standard_reps: { type: 'number', label: 'Pushups Standard Reps', placeholder: 'e.g. 20' },
            pushups_tricep_reps: { type: 'number', label: 'Pushups Tricep Reps', placeholder: 'e.g. 15' },
            crunches_reps: { type: 'number', label: 'Crunches Reps', placeholder: 'e.g. 30' },
            crossing_crunches_reps: { type: 'number', label: 'Crossing Crunches Reps', placeholder: 'e.g. 25' },
            oblique_crunches_reps: { type: 'number', label: 'Obl. Crunches Reps', placeholder: 'e.g. 20' },
            leg_lifts_reps: { type: 'number', label: 'Leg Lifts Reps', placeholder: 'e.g. 20' },
            scissor_kicks_reps: { type: 'number', label: 'Scissor Kicks Reps', placeholder: 'e.g. 20' },
            jack_knives_reps: { type: 'number', label: 'Jack Knives Reps', placeholder: 'e.g. 15' },
            bicycle_twists_reps: { type: 'number', label: 'Bicycle Twists Reps', placeholder: 'e.g. 25' },
            plank_time: { type: 'text', label: 'Plank Time', placeholder: 'e.g. 3:00' },
            inverted_plank_time: { type: 'text', label: 'Inverted Plank Time', placeholder: 'e.g. 1:45' },
            elliptical_bike_time: { type: 'text', label: 'Elliptical / Bike (min)', placeholder: 'e.g. 45' },
            stretches_post: { type: 'checkbox', label: 'Stretches' },
            body_weight: { type: 'number', label: 'Body Weight', placeholder: 'e.g. 85', isWeight: true },
            breakfast: { type: 'text', label: 'Breakfast', placeholder: 'e.g. Oatmeal with berries' },
            breakfast_calories: { type: 'number', label: 'Breakfast Calories', placeholder: 'e.g. 450' },
            lunch: { type: 'text', label: 'Lunch', placeholder: 'e.g. Grilled chicken salad' },
            lunch_calories: { type: 'number', label: 'Lunch Calories', placeholder: 'e.g. 650' },
            dinner: { type: 'text', label: 'Dinner', placeholder: 'e.g. Salmon with veggies' },
            dinner_calories: { type: 'number', label: 'Dinner Calories', placeholder: 'e.g. 720' },
            alcohol_servings: { type: 'number', label: 'Servings of Alcohol', placeholder: 'e.g. 0' },
            what_did_you_do: { type: 'textarea', label: 'What did you do today, generally speaking?', placeholder: '' },
            what_did_you_accomplish: { type: 'textarea', label: 'What did you accomplish?', placeholder: '' },
            work: { type: 'textarea', label: 'What did you do for work?', placeholder: '' },
            for_you_fam: { type: 'textarea', label: 'What did you do for you/fam?', placeholder: '' },
            high_point: { type: 'textarea', label: 'What was a high point from today?', placeholder: '' },
            plan_tomorrow: { type: 'textarea', label: 'What do you plan to do tomorrow?', placeholder: '' },
            longer_term_plans: { type: 'textarea', label: 'Longer term plans that are on your mind?', placeholder: '' }
        };
       
        function autoResizeTextarea(el) {
            if (!el || el.tagName !== 'TEXTAREA') return;
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }
       
        function renderSidebar(initialLoad = false) {
            const dateList = document.getElementById('dateList');
            dateList.innerHTML = '';
           
            const today = new Date();
            const oldestDate = new Date(2026, 6, 22);
            let currentGenDate = new Date(oldestDate);
            const maxDays = 90;
            let items = [];
           
            for (let i = 0; i < maxDays; i++) {
                const dateKey = formatDateKey(currentGenDate);
                const display = formatDisplayDate(dateKey);
                const isFuture = currentGenDate > today;
                const entry = journalData[dateKey] || {};
                const status = getEntryStatus(entry);
               
                const item = document.createElement('div');
                item.className = `date-item ${status}`;
                if (dateKey === currentDateKey) item.classList.add('current');
                if (isFuture) item.classList.add('future');
               
                item.innerHTML = `
                    <span>${display}</span>
                    <span style="font-size: 12px; color: #666;">${dateKey}</span>
                `;
               
                if (!isFuture) {
                    item.addEventListener('click', () => {
                        currentDateKey = dateKey;
                        renderForm();
                        renderSidebar(false);
                    });
                }
               
                items.push(item);
                currentGenDate.setDate(currentGenDate.getDate() + 1);
            }
           
            items.forEach(item => dateList.appendChild(item));
           
            if (initialLoad) {
                setTimeout(() => {
                    const currentItem = dateList.querySelector('.current');
                    if (currentItem) {
                        const index = Array.from(dateList.children).indexOf(currentItem);
                        dateList.scrollTop = Math.max(0, index * 52 - 500);
                    }
                }, 100);
            }
        }
       
        function getEntryStatus(entry) {
            if (!entry || Object.keys(entry).length === 0) return 'empty';
            return Object.keys(entry).length > 3 ? 'partial' : 'empty';
        }
        function parseTimeToSeconds(timeStr) {
            if (!timeStr) return 0;
            const parts = timeStr.split(':').map(Number);
            return (parts[0] || 0) * 60 + (parts[1] || 0);
        }
        function calculateTotalWork(entry) {
            if (!entry) return 0;
            let total = 0;
            const bw = parseFloat(entry.body_weight) || 80;
            const weightedPairs = [
                ['shoulders_weight', 'shoulders_reps'],
                ['military_press_weight', 'military_press_reps'],
                ['curls_weight', 'curls_reps'],
                ['tricep_curls_weight', 'tricep_curls_reps'],
                ['chest_flies_weight', 'chest_flies_reps'],
                ['chest_presses_weight', 'chest_presses_reps']
            ];
            for (let [wKey, rKey] of weightedPairs) {
                const weight = parseFloat(entry[wKey]) || 0;
                const reps = parseFloat(entry[rKey]) || 0;
                total += weight * reps;
            }
            total += (parseFloat(entry.pushups_standard_reps) || 0) * (bw * 0.7);
            total += (parseFloat(entry.pushups_tricep_reps) || 0) * (bw * 0.7);
            const coreKeys = [
                'crunches_reps',
                'crossing_crunches_reps',
                'oblique_crunches_reps',
                'leg_lifts_reps',
                'scissor_kicks_reps',
                'jack_knives_reps',
                'bicycle_twists_reps'
            ];
            coreKeys.forEach(key => {
                total += (parseFloat(entry[key]) || 0) * (bw * 0.35);
            });
            total += parseTimeToSeconds(entry.plank_time || '') * 10;
            total += parseTimeToSeconds(entry.inverted_plank_time || '') * 8;
            const cardioMin = parseFloat(entry.elliptical_bike_time) || 0;
            total += cardioMin * 12;
            return Math.round(total);
        }
        function calculateTotalCalories(entry) {
            if (!entry) return 0;
            return (parseFloat(entry.breakfast_calories) || 0) +
                   (parseFloat(entry.lunch_calories) || 0) +
                   (parseFloat(entry.dinner_calories) || 0);
        }

                        // if unchecked we simply omit it
                    } else if (fields[key] && fields[key].type === 'number') {
                        val = el.value.trim();
                        if (val !== '') {
                            if (fields[key].isWeight) {
                                val = toStorageWeight(val);

                                val = parseFloat(val);

                            entry[key] = val;

                    } else {

        // --- Personal Bests helpers ---
        function timeToSeconds(val) {
            if (val === undefined || val === null || val === '') return null;
            if (typeof val === 'number') return val;
            const str = String(val).trim();
            if (str.includes(':')) {
                const parts = str.split(':');
                return (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0);
            }
            const num = parseFloat(str);
            return isNaN(num) ? null : num;
        }

        function isBetter(key, newVal, currentVal) {
            if (newVal === undefined || newVal === null) return false;
            if (currentVal === undefined || currentVal === null) return true;

            if (key === 'body_weight') {
                const a = parseFloat(newVal), b = parseFloat(currentVal);
                return !isNaN(a) && !isNaN(b) && a < b;
            }
            if (TIME_FIELDS.includes(key)) {
                const a = timeToSeconds(newVal), b = timeToSeconds(currentVal);
                return a !== null && b !== null && a > b;
            }
            const a = parseFloat(newVal), b = parseFloat(currentVal);
            if (isNaN(a) || isNaN(b)) return String(newVal) > String(currentVal);
            return a > b;
        }

        function applyPersonalBests(pastedObj, target) {
            let entry = null;
            if (pastedObj && typeof pastedObj === 'object') {
                const keys = Object.keys(pastedObj);
                if (keys.length === 1 && typeof pastedObj[keys[0]] === 'object' && pastedObj[keys[0]] !== null) {
                    entry = pastedObj[keys[0]];
                } else {
                    entry = pastedObj;
                }
            }
            if (!entry || typeof entry !== 'object') return 0;

            let updatedCount = 0;
            const processedRepKeys = new Set();

            for (const [weightKey, repsKey] of Object.entries(WEIGHT_REP_PAIRS)) {
                if (!(weightKey in entry)) continue;
                const newWeight = parseFloat(entry[weightKey]);
                const curWeight = parseFloat(target[weightKey]);
                if (isNaN(newWeight)) continue;

                if (isNaN(curWeight) || newWeight > curWeight) {
                    target[weightKey] = newWeight;
                    updatedCount++;
                    if (repsKey in entry && entry[repsKey] != null) {
                        const newReps = parseFloat(entry[repsKey]);
                        target[repsKey] = isNaN(newReps) ? entry[repsKey] : newReps;
                        updatedCount++;
                        processedRepKeys.add(repsKey);
                    }
                } else if (newWeight === curWeight && repsKey in entry && entry[repsKey] != null) {
                    const newReps = parseFloat(entry[repsKey]);
                    const curReps = parseFloat(target[repsKey]);
                    if (!isNaN(newReps) && (isNaN(curReps) || newReps > curReps)) {
                        target[repsKey] = newReps;
                        updatedCount++;
                        processedRepKeys.add(repsKey);
                    }
                }
            }

            for (const key of Object.keys(target)) {
                if (key in WEIGHT_REP_PAIRS || processedRepKeys.has(key) || !(key in entry)) continue;
                if (isBetter(key, entry[key], target[key])) {
                    if (TIME_FIELDS.includes(key) || key === 'elliptical_bike_time') {
                        target[key] = String(entry[key]);
                    } else {
                        const num = parseFloat(entry[key]);
                        target[key] = isNaN(num) ? entry[key] : num;
                    }
                    updatedCount++;
                }
            }
            return updatedCount;
        }

            const groups = [
                ['shoulders_weight', 'shoulders_reps'],
                ['military_press_weight', 'military_press_reps'],
                ['curls_weight', 'curls_reps'],
                ['tricep_curls_weight', 'tricep_curls_reps'],
                ['chest_flies_weight', 'chest_flies_reps'],
                ['chest_presses_weight', 'chest_presses_reps'],
                ['pushups_standard_reps', 'pushups_tricep_reps'],
                ['crunches_reps', 'crossing_crunches_reps', 'oblique_crunches_reps',
                 'leg_lifts_reps', 'scissor_kicks_reps', 'jack_knives_reps',
                 'bicycle_twists_reps', 'plank_time', 'inverted_plank_time'],
                ['elliptical_bike_time', 'body_weight']
            ];
            const perHand = new Set(PER_HAND_FIELDS);

            groups.forEach((group, gi) => {
                if (gi > 0) lines.push('');
                group.forEach(key => {
                    const val = obj[key];
                    const rendered = typeof val === 'string' ? `'${val}'` : String(val);
                    const comment = perHand.has(key) ? '          // per hand' : '';
                    lines.push(`    ${key}: ${rendered},${comment}`);
                });
            });
            lines.push('};');
            return lines.join('\n');
        }

function setupMenu() {
    const hamburger = document.getElementById('hamburgerBtn');
    const dropdown = document.getElementById('menuDropdown');
    const unitBtn = document.getElementById('unitToggleBtn');
    const unitLabel = document.getElementById('unitToggleLabel');
    const exportBtn = document.getElementById('exportBtn');
    const importBtn = document.getElementById('importBtn');
    const importFile = document.getElementById('importFile');
    const updatePBsBtn = document.getElementById('updatePBsBtn');
    const pbModalOverlay = document.getElementById('pbModalOverlay');
    const pbJsonInput = document.getElementById('pbJsonInput');
    const pbModalClose = document.getElementById('pbModalClose');
    const pbUpdateBtn = document.getElementById('pbUpdateBtn');
   
    unitLabel.textContent = useLbs ? 'Lbs' : 'Kg';
   
    hamburger.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown.classList.toggle('open');
    });
   
    document.addEventListener('click', (e) => {
        if (!dropdown.contains(e.target) && e.target !== hamburger && !hamburger.contains(e.target)) {
            dropdown.classList.remove('open');
        }
    });
   
    unitBtn.addEventListener('click', () => {
        useLbs = !useLbs;
        unitLabel.textContent = useLbs ? 'Lbs' : 'Kg';
        saveData();
        renderForm();
        dropdown.classList.remove('open');
    });
   
    exportBtn.addEventListener('click', () => {
        const dataStr = JSON.stringify(journalData, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `journal-export-${formatDateKey(new Date())}.json`;
        a.click();
        URL.revokeObjectURL(url);
        dropdown.classList.remove('open');
    });
   
    importBtn.addEventListener('click', () => {
        importFile.click();
        dropdown.classList.remove('open');
    });
   
    importFile.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const imported = JSON.parse(ev.target.result);
                if (typeof imported !== 'object' || imported === null || Array.isArray(imported)) {
                    alert('Invalid journal data file.');
                    return;
                }
                if (!confirm('Import will safely merge with existing data (never deletes journal text or other fields). Continue?')) {
                    importFile.value = '';
                    return;
                }

                // Safe deep merge:
                // - Existing dates keep all their keys
                // - Imported keys for a date only add/update those specific fields
                // - longer_term_plans only updates if the import actually provides a non-empty string
                // - No date or top-level key is ever deleted
                let datesUpdated = 0;
                let fieldsAddedOrUpdated = 0;

                for (const [key, value] of Object.entries(imported)) {
                    if (key === 'longer_term_plans') {
                        if (typeof value === 'string' && value.trim() !== '') {
                            // Only overwrite the shared plans if the import has real content
                            journalData.longer_term_plans = value;
                        }
                        continue;
                    }

                    // Expect date keys like YYYY-MM-DD
                    if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) continue;
                    if (typeof value !== 'object' || value === null || Array.isArray(value)) continue;

                    if (!journalData[key]) {
                        journalData[key] = {};
                        datesUpdated++;
                    }

                    for (const [field, fieldVal] of Object.entries(value)) {
                        // Skip empty / nullish so we never wipe an existing value with blank import data
                        if (fieldVal === undefined || fieldVal === null) continue;
                        if (typeof fieldVal === 'string' && fieldVal.trim() === '') continue;

                        const prev = journalData[key][field];
                        if (prev !== fieldVal) {
                            journalData[key][field] = fieldVal;
                            fieldsAddedOrUpdated++;
                        }
                    }
                }

                if (typeof journalData.longer_term_plans === 'undefined') {
                    journalData.longer_term_plans = '';
                }

                saveData();
                renderSidebar(true);
                renderForm();
                alert(`Import successful.\nDates touched: ${datesUpdated}\nFields added/updated: ${fieldsAddedOrUpdated}\n\nExisting journal text and other data were preserved.`);
            } catch (err) {
                alert('Failed to parse JSON file.');
            }
            importFile.value = '';
        };
        reader.readAsText(file);
    });

    // --- Update Personal Bests ---
    updatePBsBtn.addEventListener('click', () => {
        dropdown.classList.remove('open');
        pbJsonInput.value = '';
        pbModalOverlay.style.display = 'flex';
        setTimeout(() => pbJsonInput.focus(), 100);
    });

    pbModalClose.addEventListener('click', () => {
        pbModalOverlay.style.display = 'none';
    });

    pbModalOverlay.addEventListener('click', (e) => {
        if (e.target === pbModalOverlay) pbModalOverlay.style.display = 'none';
    });

    pbUpdateBtn.addEventListener('click', async () => {
        const raw = pbJsonInput.value.trim();
        if (!raw) {
            alert('Paste some JSON first');
            return;
        }

        let cleaned = raw
            .replace(/[\u201C\u201D]/g, '"')
            .replace(/[\u2018\u2019]/g, "'")
            .replace(/[\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000\t]/g, ' ')
            .replace(/,(\s*[}\]])/g, '$1')
            .trim();

        let parsed;
        try {
            parsed = JSON.parse(cleaned);
        } catch (err) {
            alert('Invalid JSON\n' + err.message);
            return;
        }

        const updated = { ...PLACEHOLDERS };
        const count = applyPersonalBests(parsed, updated);

        if (count === 0) {
            alert('No new personal bests');
            pbModalOverlay.style.display = 'none';
            return;
        }

        const source = buildPlaceholdersSource(updated);

        try {
            await navigator.clipboard.writeText(source);
            alert(`Copied updated PLACEHOLDERS (${count} change${count === 1 ? '' : 's'})\n\nPaste it over the existing const PLACEHOLDERS in both files.`);
        } catch (err) {
            prompt('Copy this:', source);
        }

        pbModalOverlay.style.display = 'none';
    });
}
       
        function init() {
            loadData();
            renderSidebar(true);
            renderForm();
            setupAutoSave();
            setupMenu();
           
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 's') {
                    e.preventDefault();
                    saveCurrentEntry();
                }
            });
        }
       
        window.onload = init;
    </script>
