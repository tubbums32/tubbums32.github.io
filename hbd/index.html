<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preload" href="hbd.jpg" as="image">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Happy Birthday!</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:#000;
  color:#fff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button{font:inherit}
#blackout{
  position:fixed;
  inset:0;
  z-index:100;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity 1.5s ease,visibility 1.5s ease;
}
#blackout.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
.birthday-button{
  width:130px;
  height:130px;
  border:0;
  border-radius:50%;
  background:radial-gradient(circle at 35% 28%,#fff 0,#ffd95c 8%,#ff4fb3 38%,#7d2cff 72%,#18002e 100%);
  box-shadow:
    0 0 25px rgba(255,255,255,.35),
    0 0 70px rgba(255,0,180,.45),
    0 0 130px rgba(90,0,255,.35);
  cursor:pointer;
  font-size:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  animation:buttonPulse 2.2s ease-in-out infinite;
  transition:transform .3s ease;
}
.birthday-button:hover{transform:scale(1.08)}
.birthday-button:active{transform:scale(.94)}
#experience{
  position:fixed;
  inset:0;
  opacity:0;
  visibility:hidden;
  transition:opacity 1.4s ease,visibility 1.4s ease;
}
#experience.active{
  opacity:1;
  visibility:visible;
}
#background{
  position:absolute;
  inset:-30%;
  background:
    radial-gradient(circle at 50% 45%,rgba(255,0,150,.14),transparent 23%),
    radial-gradient(circle at 20% 20%,rgba(0,210,255,.10),transparent 23%),
    radial-gradient(circle at 80% 80%,rgba(110,0,255,.14),transparent 28%),
    #08000f;
}
#lighting{
  position:absolute;
  inset:-40%;
  opacity:.2;
  filter:blur(80px);
  background:conic-gradient(
    from 0deg,
    rgba(255,0,140,.7),
    rgba(255,220,0,.45),
    rgba(0,230,255,.65),
    rgba(120,0,255,.7),
    rgba(255,0,140,.7)
  );
  animation:lightingSpin 20s linear infinite;
  transition:opacity 2s ease,filter 2s ease;
}
#experience.revealed #lighting{
  opacity:.75;
  filter:blur(65px);
  animation-duration:9s;
}
#colorWash{
  position:absolute;
  inset:0;
  opacity:0;
  background:
    radial-gradient(circle at 20% 30%,rgba(255,0,150,.35),transparent 28%),
    radial-gradient(circle at 80% 25%,rgba(0,230,255,.3),transparent 28%),
    radial-gradient(circle at 50% 100%,rgba(140,0,255,.4),transparent 38%);
  mix-blend-mode:screen;
  animation:colorPulse 5s ease-in-out infinite;
  transition:opacity 2s ease;
}
#experience.revealed #colorWash{opacity:1}
#vignette{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:radial-gradient(circle,transparent 42%,rgba(0,0,0,.72) 120%);
}
canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}
#confettiCanvas{z-index:12}
#sparkleCanvas{z-index:4}
.stage{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  perspective:1400px;
}
.card{
  position:relative;
  width:min(850px,94vw);
  max-height:94vh;
  padding:40px 40px 34px;
  border-radius:38px;
  border:1px solid rgba(255,255,255,.22);
  background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.035));
  box-shadow:
    0 35px 110px rgba(0,0,0,.65),
    inset 0 1px rgba(255,255,255,.25),
    0 0 80px rgba(255,0,170,.1);
  backdrop-filter:blur(20px) saturate(130%);
  -webkit-backdrop-filter:blur(20px) saturate(130%);
  text-align:center;
  transform:translateY(20px) scale(.94);
  transition:
    transform 1.2s cubic-bezier(.2,.8,.2,1),
    opacity 1.2s ease;
  opacity:0;
}
#experience.active .card{
  transform:translateY(0) scale(1);
  opacity:1;
}
.card::before{
  content:"";
  position:absolute;
  width:500px;
  height:500px;
  left:50%;
  top:-340px;
  transform:translateX(-50%);
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.2),transparent 68%);
  pointer-events:none;
}
.card::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  padding:1px;
  background:linear-gradient(
    120deg,
    rgba(255,0,150,.7),
    transparent 25%,
    rgba(0,220,255,.7),
    transparent 60%,
    rgba(255,220,0,.7)
  );
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  opacity:.55;
  animation:borderHue 8s linear infinite;
  pointer-events:none;
}
.title{
  position:relative;
  z-index:2;
  margin:0;
  font-size:clamp(3rem,8vw,6.8rem);
  line-height:.9;
  font-weight:1000;
  letter-spacing:-.075em;
  text-transform:uppercase;
  background:linear-gradient(
    90deg,
    #ff35ac,
    #ffe94f,
    #4eeeff,
    #b66cff,
    #ff35ac
  );
  background-size:300% auto;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  filter:drop-shadow(0 8px 25px rgba(255,0,180,.35));
  animation:titleGradient 7s linear infinite;
  transition:filter 1s ease;
}
#experience.revealed .title{
  filter:
    drop-shadow(0 0 10px rgba(255,255,255,.55))
    drop-shadow(0 0 35px rgba(255,0,180,.65));
  animation:titleGradient 3s linear infinite;
}
.subtitle{
  position:relative;
  z-index:2;
  margin:16px 0 27px;
  font-size:clamp(.85rem,2vw,1.15rem);
  font-weight:800;
  letter-spacing:.18em;
  text-transform:uppercase;
  opacity:.72;
}
.portrait-area{
  position:relative;
  width:min(370px,68vw);
  aspect-ratio:1;
  margin:0 auto 29px;
  cursor:pointer;
  perspective:1200px;
}
.portrait-glow{
  position:absolute;
  inset:-35px;
  border-radius:50%;
  background:conic-gradient(
    #ff008c,#ffd700,#00eaff,#8f3cff,#ff008c
  );
  filter:blur(28px);
  opacity:.38;
  animation:spin 9s linear infinite;
  transition:opacity 1.5s ease,filter 1.5s ease;
}
#experience.revealed .portrait-glow{
  opacity:.85;
  filter:blur(32px);
  animation-duration:4s;
}
.flip-card{
  position:absolute;
  inset:0;
  transform-style:preserve-3d;
  -webkit-transform-style:preserve-3d;
  transition:transform 1.25s cubic-bezier(.16,.75,.2,1);
  will-change:transform;
}
.portrait-area.flipped .flip-card{
  transform:rotateY(180deg);
}
.face{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  transform-style:preserve-3d;
  -webkit-transform-style:preserve-3d;
  border:7px solid rgba(8,0,25,.95);
  background:#14002d;
  box-shadow:
    inset 0 0 30px rgba(0,0,0,.5),
    0 20px 60px rgba(0,0,0,.55);
}

.face img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}
.face-front{
  transform:rotateY(0deg);
  -webkit-transform:rotateY(0deg);
}

.face-back{
  transform:rotateY(180deg);
  -webkit-transform:rotateY(180deg);
}
.face-back::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(120deg,transparent 25%,rgba(255,255,255,.32) 48%,transparent 65%);
  transform:translateX(-120%);
  animation:shine 4s ease-in-out infinite;
}
.ring{
  position:absolute;
  inset:-11px;
  border-radius:50%;
  background:conic-gradient(
    from 0deg,
    #ff1493,
    #ffd700,
    #00ffff,
    #8a2be2,
    #ff1493
  );
  animation:spin 6s linear infinite;
  box-shadow:0 0 45px rgba(255,0,180,.45);
  pointer-events:none;
}
.hint{
  position:absolute;
  z-index:10;
  bottom:-12px;
  left:50%;
  transform:translateX(-50%);
  padding:7px 14px;
  border-radius:30px;
  background:rgba(0,0,0,.45);
  border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(8px);
  font-size:.7rem;
  font-weight:800;
  letter-spacing:.1em;
  text-transform:uppercase;
  white-space:nowrap;
  opacity:.75;
  transition:opacity .5s;
}
#experience.revealed .hint{opacity:0}
.message{
  position:relative;
  z-index:2;
  max-width:650px;
  margin:0 auto;
  font-size:clamp(1rem,2.5vw,1.35rem);
  line-height:1.5;
  font-weight:650;
  opacity:.88;
}
.party{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:23px;
  font-size:clamp(1.5rem,4vw,2.3rem);
}
.party span{
  animation:bounce 1.35s ease-in-out infinite;
}
.party span:nth-child(2){animation-delay:.12s}
.party span:nth-child(3){animation-delay:.24s}
.party span:nth-child(4){animation-delay:.36s}
.party span:nth-child(5){animation-delay:.48s}
#endFade{
  position:fixed;
  inset:0;
  z-index:200;
  background:#000;
  opacity:0;
  visibility:hidden;
  transition:opacity 2.8s ease,visibility 2.8s ease;
}
#endFade.fading{
  opacity:1;
  visibility:visible;
}
#endFade.finished{
  opacity:1;
  visibility:visible;
}
@keyframes buttonPulse{
  0%,100%{
    transform:scale(1);
    box-shadow:0 0 25px rgba(255,255,255,.35),0 0 70px rgba(255,0,180,.45),0 0 130px rgba(90,0,255,.35)
  }
  50%{
    transform:scale(1.045);
    box-shadow:0 0 35px rgba(255,255,255,.5),0 0 95px rgba(255,0,180,.65),0 0 160px rgba(90,0,255,.45)
  }
}
@keyframes lightingSpin{to{transform:rotate(360deg)}}
@keyframes colorPulse{
  0%,100%{transform:scale(1);opacity:.7}
  50%{transform:scale(1.15);opacity:1}
}
@keyframes borderHue{to{filter:hue-rotate(360deg)}}
@keyframes titleGradient{to{background-position:300% center}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{
  0%,35%{transform:translateX(-120%)}
  65%,100%{transform:translateX(120%)}
}
@keyframes bounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}
@media(max-width:600px){
  .stage{padding:15px}
  .card{padding:30px 18px 27px;border-radius:28px}
  .portrait-area{width:min(300px,66vw);margin-bottom:23px}
  .message{font-size:1rem}
  .party{margin-top:17px}
}
@media(prefers-reduced-motion:reduce){
  .birthday-button,.portrait-glow,.ring,.party span,#lighting,.title{animation:none}
}
</style>
</head>
<body>

<!-- OPENING SCREEN -->
<div id="blackout">
  <button class="birthday-button" id="startButton" aria-label="Open birthday card">
    🎂
  </button>
</div>

<!-- MAIN EXPERIENCE -->
<div id="experience">
  <div id="background"></div>
  <div id="lighting"></div>
  <div id="colorWash"></div>

  <canvas id="sparkleCanvas"></canvas>
  <canvas id="confettiCanvas"></canvas>

  <div class="stage">
    <main class="card" id="card">

      <h1 class="title" id="title">Happy Birthday!</h1>

      <div class="subtitle" id="subtitle">
        A little something for you
      </div>

      <div class="portrait-area" id="portrait">
        <div class="portrait-glow"></div>
        <div class="ring"></div>

        <div class="flip-card">
          <div class="face face-front">
            <img src="anon.png" alt="Anonymous portrait">
          </div>

          <div class="face face-back">
            <img src="hbd.jpg" alt="Birthday portrait">
          </div>
        </div>

        <div class="hint">Whose birthday is it???</div>
      </div>


      <div class="party" aria-hidden="true">
        <span>🎂</span>
        <span>🎈</span>
        <span>🎁</span>
        <span>🥳</span>
        <span>🎊</span>
      </div>

    </main>
  </div>

  <div id="vignette"></div>
</div>

<!-- FINAL BLACK FADE -->
<div id="endFade"></div>

<!-- AUDIO -->
<audio id="birthdayMusic" src="hbd.mp3" preload="auto"></audio>
<audio id="partyHorn" src="partyhorn.mp3" preload="auto"></audio>
<audio id="cheering" src="cheering.mp3" preload="auto"></audio>
<audio id="wow" src="wow.mp3" preload="auto"></audio>

<script>
const experience=document.getElementById("experience");
const blackout=document.getElementById("blackout");
const startButton=document.getElementById("startButton");
const portrait=document.getElementById("portrait");
const title=document.getElementById("title");
const subtitle=document.getElementById("subtitle");
const endFade=document.getElementById("endFade");

const birthdayMusic=document.getElementById("birthdayMusic");
const partyHorn=document.getElementById("partyHorn");
const cheering=document.getElementById("cheering");
const wow=document.getElementById("wow");

let state="intro";
let audioFadeTimer=null;


/* =========================================================
   AUDIO HELPERS
========================================================= */
function playSound(sound,volume=1){
  sound.currentTime=0;
  sound.volume=volume;
  sound.play().catch(()=>{});
}

function beginBirthdayMusic(){
  birthdayMusic.volume=0;
  birthdayMusic.currentTime=0;

  birthdayMusic.play().catch(()=>{});

  const start=performance.now();
  const duration=1800;

  function fadeIn(now){
    const progress=Math.min((now-start)/duration,1);
    birthdayMusic.volume=progress*.62;
    if(progress<1)requestAnimationFrame(fadeIn);
  }

  requestAnimationFrame(fadeIn);
}

function fadeMusicOut(){
  if(audioFadeTimer)clearInterval(audioFadeTimer);

  const startVolume=birthdayMusic.volume;
  const duration=2800;
  const start=performance.now();

  function fade(now){
    const progress=Math.min((now-start)/duration,1);
    birthdayMusic.volume=Math.max(0,startVolume*(1-progress));

    if(progress<1){
      requestAnimationFrame(fade);
    }else{
      birthdayMusic.pause();
      birthdayMusic.currentTime=0;
    }
  }

  requestAnimationFrame(fade);
}


/* =========================================================
   INTRO
========================================================= */
startButton.addEventListener("click",()=>{
  if(state!=="intro")return;

  state="anonymous";
  autoFadeTimer=setTimeout(fadeToBlack,55000);

  blackout.classList.add("hidden");
  experience.classList.add("active");

  /*
    Start the music here because this click counts as a
    direct user gesture and is therefore much more likely
    to satisfy browser autoplay rules.
  */
  beginBirthdayMusic();
});


/* =========================================================
   PORTRAIT REVEAL
========================================================= */
portrait.addEventListener("click",()=>{
  if(state!=="anonymous")return;

  state="revealing";

  portrait.classList.add("flipped");

  title.textContent="Happy Birthday, Steve!!";
  subtitle.textContent="🎉 LET THE CELEBRATION BEGIN 🎉";

  /*
    Give the flip a fraction of a second to begin,
    then fire the celebration at the visual reveal.
  */
  setTimeout(()=>{
    state="revealed";

    experience.classList.add("revealed");

    createExplosion();

    playSound(partyHorn,.95);
    setTimeout(()=>playSound(cheering,.2),120);
    setTimeout(()=>playSound(wow,1.0),420);
  },600);
});


/* =========================================================
   FINAL CLICK
========================================================= */
document.addEventListener("click",event=>{
  if(state!=="revealed")return;
  if(event.target.closest(".portrait-area"))return;
  fadeToBlack();
});


/* =========================================================
   SPARKLES
========================================================= */
const sparkleCanvas=document.getElementById("sparkleCanvas");
const sctx=sparkleCanvas.getContext("2d");

let W=window.innerWidth;
let H=window.innerHeight;
let DPR=Math.min(window.devicePixelRatio||1,2);

const stars=[];
const STAR_COUNT=75;

function resizeCanvases(){
  W=window.innerWidth;
  H=window.innerHeight;
  DPR=Math.min(window.devicePixelRatio||1,2);

  for(const canvas of [sparkleCanvas,document.getElementById("confettiCanvas")]){
    canvas.width=W*DPR;
    canvas.height=H*DPR;
    canvas.style.width=W+"px";
    canvas.style.height=H+"px";
  }

  sctx.setTransform(DPR,0,0,DPR,0,0);
  confettiCtx.setTransform(DPR,0,0,DPR,0,0);
}

function newStar(initial=true){
  return{
    x:Math.random()*W,
    y:initial?Math.random()*H:H+20,
    size:.4+Math.random()*2,
    speed:.12+Math.random()*.45,
    phase:Math.random()*Math.PI*2,
    twinkle:.01+Math.random()*.025
  };
}

for(let i=0;i<STAR_COUNT;i++)stars.push(newStar(true));

function animateSparkles(){
  sctx.clearRect(0,0,W,H);

  for(const s of stars){
    s.y-=s.speed;
    s.phase+=s.twinkle;

    if(s.y<-10)Object.assign(s,newStar(false));

    const alpha=.2+.45*((Math.sin(s.phase)+1)/2);

    sctx.save();
    sctx.globalAlpha=alpha;
    sctx.fillStyle="#fff";
    sctx.shadowBlur=10;
    sctx.shadowColor="#fff";

    sctx.beginPath();
    sctx.arc(s.x,s.y,s.size,0,Math.PI*2);
    sctx.fill();

    sctx.restore();
  }

  requestAnimationFrame(animateSparkles);
}


/* =========================================================
   CONFETTI ENGINE
========================================================= */
const confettiCanvas=document.getElementById("confettiCanvas");
const confettiCtx=confettiCanvas.getContext("2d");

const confetti=[];
const MAX_CONFETTI=600;

const confettiColors=[
  "#ff2cac",
  "#ffe04b",
  "#42eaff",
  "#a866ff",
  "#ffffff",
  "#ff6b6b",
  "#72ff8c"
];

function makeConfetti(x,y,explosion=false){
  const angle=explosion
    ?Math.random()*Math.PI*2
    :Math.random()*Math.PI*2;

  const speed=explosion
    ?8+Math.random()*18
    :.7+Math.random()*2.2;

  return{
    x:x,
    y:y,
    vx:Math.cos(angle)*speed,
    vy:Math.sin(angle)*speed-(explosion?3:0),
    gravity:explosion?.18:.025+Math.random()*.03,
    drag:explosion?.985:1,
    size:4+Math.random()*8,
    length:5+Math.random()*11,
    rotation:Math.random()*Math.PI*2,
    spin:(Math.random()-.5)*.35,
    wobble:Math.random()*Math.PI*2,
    wobbleSpeed:.02+Math.random()*.06,
    opacity:.65+Math.random()*.35,
    color:confettiColors[
      Math.floor(Math.random()*confettiColors.length)
    ],
    shape:Math.random()<.7?"rect":"circle",
    life:0,
    maxLife:explosion
      ?220+Math.random()*130
      :Infinity
  };
}

function createExplosion(){
  /*
    Several layers make the burst feel much larger than
    a single particle spawn.
  */
  const cx=W/2;
  const cy=H*.48;

  for(let i=0;i<MAX_CONFETTI;i++){
    confetti.push(makeConfetti(cx,cy,true));
  }

  /*
    Secondary explosions around the card.
  */
  setTimeout(()=>{
    for(let i=0;i<180;i++){
      confetti.push(
        makeConfetti(
          W*(.15+Math.random()*.7),
          H*(.15+Math.random()*.55),
          true
        )
      );
    }
  },180);

  /*
    Keep celebratory confetti falling after the explosion.
  */
  setTimeout(()=>{
    for(let i=0;i<100;i++){
      const p=makeConfetti(Math.random()*W,-20,false);
      p.vx=(Math.random()-.5)*1.5;
      p.vy=1+Math.random()*2;
      confetti.push(p);
    }
  },700);
}

function animateConfetti(){
  confettiCtx.clearRect(0,0,W,H);

  for(let i=confetti.length-1;i>=0;i--){
    const p=confetti[i];

    p.life++;

    p.vx*=p.drag;
    p.vy+=p.gravity;
    p.x+=p.vx;
    p.y+=p.vy;

    p.wobble+=p.wobbleSpeed;
    p.x+=Math.sin(p.wobble)*.5;
    p.rotation+=p.spin;

    if(
      p.life>p.maxLife ||
      p.y>H+60 ||
      p.x<-100 ||
      p.x>W+100
    ){
      confetti.splice(i,1);
      continue;
    }

    const fade=p.maxLife===Infinity
      ?1
      :Math.min(1,(p.maxLife-p.life)/35);

    confettiCtx.save();
    confettiCtx.translate(p.x,p.y);
    confettiCtx.rotate(p.rotation);
    confettiCtx.globalAlpha=p.opacity*Math.max(0,fade);
    confettiCtx.fillStyle=p.color;

    if(p.shape==="rect"){
      confettiCtx.fillRect(
        -p.size/2,
        -p.length/2,
        p.size,
        p.length
      );
    }else{
      confettiCtx.beginPath();
      confettiCtx.arc(
        0,0,p.size*.45,0,Math.PI*2
      );
      confettiCtx.fill();
    }

    confettiCtx.restore();
  }

  /*
    Once revealed, maintain a gentle continuous rain.
  */
  if(state==="revealed" && confetti.length<250){
    for(let i=0;i<3;i++){
      const p=makeConfetti(Math.random()*W,-20,false);
      p.vy=1+Math.random()*1.5;
      p.vx=(Math.random()-.5)*1.2;
      confetti.push(p);
    }
  }

  requestAnimationFrame(animateConfetti);
}

let autoFadeTimer=null;

function fadeToBlack(){
  if(state==="ending"||state==="finished")return;

  state="ending";

  fadeMusicOut();

  experience.style.transition="opacity 2.8s ease";
  experience.style.opacity="0";

  setTimeout(()=>{
    endFade.classList.add("fading");
  },100);

  setTimeout(()=>{
    state="finished";
    endFade.classList.add("finished");
  },3000);
}


/* =========================================================
   START CANVAS LOOPS
========================================================= */
resizeCanvases();

window.addEventListener("resize",resizeCanvases,{passive:true});

requestAnimationFrame(animateSparkles);
requestAnimationFrame(animateConfetti);


/* =========================================================
   OPTIONAL KEYBOARD ACCESSIBILITY
========================================================= */
startButton.addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key===" "){
    e.preventDefault();
    startButton.click();
  }
});
</script>
</body>
</html>
